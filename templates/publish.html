{% extends "base.html" %}
{% block title %}发布物品 - 중고캠퍼스{% endblock %}
{% block content %}
<div class="form-card" style="max-width:660px;">
    <h1 class="page-title" style="text-align:center;margin-bottom:28px;">发布二手物品</h1>
    <form method="POST" action="{{ url_for('publish') }}" id="publishForm">
        <div class="form-group">
            <label for="title">商品标题 *</label>
            <input type="text" id="title" name="title" required placeholder="例如：高等数学教材（同济第七版）" maxlength="100">
        </div>
        <div class="form-group">
            <label for="category">分类 *</label>
            <select id="category" name="category" required>
                <option value="">请选择分类</option>
                {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="price">价格（韩元）*</label>
            <input type="number" id="price" name="price" required min="0" placeholder="例如：5000">
        </div>
        <div class="form-group">
            <label for="condition">成色 *</label>
            <select id="condition" name="condition" required>
                <option value="">请选择成色</option>
                {% for cond in conditions %}
                    <option value="{{ cond }}">{{ cond }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="description">物品描述</label>
            <textarea id="description" name="description" placeholder="描述物品的使用情况、购买时间、有无瑕疵等" maxlength="1000"></textarea>
        </div>
        <div class="form-group">
            <label for="image_input">商品图片 *</label>
            <div class="upload-dropzone" onclick="document.getElementById('image_input').click()">
                <div style="font-size:32px;margin-bottom:8px;">📷</div>
                <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">点击选择图片</div>
                <input type="file" id="image_input" accept="image/*" style="display:none;">
                <input type="hidden" id="image_base64" name="image_base64">
                <p style="font-size:12px;color:var(--text-muted);margin-top:6px;">图片将自动压缩后上传，建议尺寸不超过 800px 宽</p>
                <div style="display:flex;justify-content:center;">
                    <img id="image_preview" class="image-preview" alt="预览">
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:12px;padding:14px;">发布商品</button>
    </form>
</div>
{% endblock %}
