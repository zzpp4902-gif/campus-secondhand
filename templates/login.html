{% extends "base.html" %}
{% block title %}登录 - 중고캠퍼스{% endblock %}
{% block content %}
<div class="form-card" style="max-width:440px;">
    <h1 class="page-title" style="text-align:center;margin-bottom:28px;">用户登录</h1>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;padding:13px;">登录</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--text-secondary);">
        还没有账号？<a href="{{ url_for('register') }}" style="color:var(--primary);font-weight:600;">立即注册</a>
    </p>
    <div style="margin-top:20px;padding:12px;background:var(--bg-surface-subtle);border-radius:var(--radius-lg);text-align:center;border:1px dashed var(--border-subtle);">
        <p style="font-size:13px;color:var(--text-secondary);cursor:pointer;" onclick="document.getElementById('username').value='demo';document.getElementById('password').value='demo123';">
            测试账号：demo / demo123
        </p>
    </div>
</div>
{% endblock %}
