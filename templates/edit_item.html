{% extends "base.html" %}
{% block title %}编辑商品 - 중고캠퍼스{% endblock %}
{% block content %}
<div class="form-card" style="max-width:660px;">
    <h1 class="page-title" style="text-align:center;margin-bottom:28px;">编辑商品</h1>
    <form method="POST" action="{{ url_for('edit_item', item_id=item.id) }}" id="publishForm">
        <div class="form-group">
            <label for="title">商品标题 *</label>
            <input type="text" id="title" name="title" required value="{{ item.title }}" maxlength="100">
        </div>
        <div class="form-group">
            <label for="category">分类 *</label>
            <select id="category" name="category" required>
                {% for cat in categories %}
                    <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="price">价格（韩元）*</label>
            <input type="number" id="price" name="price" required min="0" value="{{ item.price }}">
        </div>
        <div class="form-group">
            <label for="condition">成色 *</label>
            <select id="condition" name="condition" required>
                {% for cond in conditions %}
                    <option value="{{ cond }}" {% if item.condition == cond %}selected{% endif %}>{{ cond }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="description">物品描述</label>
            <textarea id="description" name="description" maxlength="1000">{{ item.description or '' }}</textarea>
        </div>
        <div class="form-group">
            <label for="image_input">更换商品图片（不选则保留原图）</label>
            <div class="upload-dropzone" onclick="document.getElementById('image_input').click()">
                <div style="font-size:32px;margin-bottom:8px;">📷</div>
                <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">点击更换图片</div>
                <input type="file" id="image_input" accept="image/*" style="display:none;">
                <input type="hidden" id="image_base64" name="image_base64">
                <div style="display:flex;justify-content:center;">
                    {% if item.image_base64 %}
                        <img id="image_preview" class="image-preview show" src="{{ item.image_base64 }}" alt="当前图片">
                    {% else %}
                        <img id="image_preview" class="image-preview" alt="预览">
                    {% endif %}
                </div>
            </div>
        </div>
        <div style="display:flex;gap:12px;margin-top:16px;">
            <button type="submit" class="btn btn-primary" style="flex:1;padding:13px;">保存修改</button>
            <a href="{{ url_for('detail', item_id=item.id) }}" class="btn btn-secondary" style="flex:1;text-align:center;line-height:42px;padding:0;">取消</a>
        </div>
    </form>
</div>
{% endblock %}
